      <rect y="84" width="320" height="34" rx="6" fill="#1C1036" stroke="#4C1D95" stroke-width="1" />
      <text x="14" y="105" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#DDD6FE">
        768-dim Embedding Generator
      </text>
