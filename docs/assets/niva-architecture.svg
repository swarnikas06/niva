      </text>
      <text x="20" y="94" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94A3B8">
        • Full ACID Relational Integrity with Drizzle ORM
      </text>
      <text x="20" y="110" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94A3B8">
        • Atomic SKIP LOCKED Job Queues &amp; Audit Logs
      </text>
    </g>

    <!-- Redis Node -->
    <g transform="translate(440, 0)">
      <rect width="320" height="130" rx="14" fill="url(#workerGrad)" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />
      <rect x="20" y="14" width="160" height="24" rx="6" fill="#78350F" fill-opacity="0.5" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1" />
      <text x="30" y="30" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FDE68A">
