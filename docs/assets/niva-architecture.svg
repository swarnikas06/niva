      </text>

      <!-- Pill 3: State -->
      <rect x="404" width="230" height="34" rx="6" fill="#0A1E2E" stroke="#1E3A5F" stroke-width="1" />
      <text x="418" y="21" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#93C5FD">
