<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="archBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0E1E17" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#080E14" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#04070B" stop-opacity="1" />
    </radialGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2218" />
      <stop offset="100%" stop-color="#05130D" />
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1438" />
      <stop offset="100%" stop-color="#0E0822" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2132" />
      <stop offset="100%" stop-color="#07131E" />
    </linearGradient>

    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B08" />
      <stop offset="100%" stop-color="#120D04" />
    </linearGradient>

    <!-- Emerald Flow Stroke -->
    <linearGradient id="flowEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A855F7" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>

    <!-- Grid -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10B981" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="760" fill="url(#archBg)" />
  <rect width="1200" height="760" fill="url(#archGrid)" />
  <rect width="1198" height="758" x="1" y="1" rx="16" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Diagram Header -->
  <g transform="translate(60, 48)">
    <rect width="168" height="24" rx="12" fill="#061E14" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10B981" />
    <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" letter-spacing="1.5">
