<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="socialBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0E2319" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#070D14" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030508" stop-opacity="1" />
    </radialGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="socialEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <linearGradient id="socialBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#BEF264" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="socialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="socialGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10B981" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#socialBg)" />
  <rect width="1280" height="640" fill="url(#socialGrid)" />
  <rect width="1278" height="638" x="1" y="1" rx="20" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="2" />

  <!-- Center Emblem Composition -->
  <g transform="translate(640, 210)" text-anchor="middle">
    <!-- Glowing Icon -->
    <g transform="translate(-56, -140) scale(0.44)" filter="url(#socialGlow)">
      <rect width="256" height="256" rx="56" fill="#081A12" stroke="#10B981" stroke-opacity="0.6" stroke-width="3" />
      <g transform="translate(48, 48)">
        <path d="M 0 160 L 0 0 L 34 0 L 34 160 Z" fill="url(#socialEmerald)" />
        <path d="M 0 0 L 126 160 L 160 160 L 34 0 Z" fill="url(#socialBeam)" />
        <path d="M 126 0 L 160 0 L 160 160 L 126 160 Z" fill="url(#socialEmerald)" />
        <polygon points="0,0 34,0 0,44" fill="#A7F3D0" opacity="0.4" />
        <polygon points="126,160 160,160 160,116" fill="#ECFCCB" opacity="0.4" />
      </g>
      <circle cx="208" cy="48" r="8" fill="#BEF264" />
      <circle cx="208" cy="48" r="16" fill="#10B981" fill-opacity="0.3" />
    </g>

    <!-- NIVA Title -->
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="80" letter-spacing="6" fill="#FFFFFF">
      NIV<tspan fill="url(#socialEmerald)">A</tspan>
    </text>

    <!-- Tagline: "Your Life, Understood." -->
    <text y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" letter-spacing="-0.5" fill="#E2E8F0">
      Your Life, <tspan fill="url(#socialEmerald)">Understood.</tspan>
    </text>

    <!-- Subtitle / Positioning -->
    <text y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      A persistent personal AI companion that understands context, remembers what matters,
    </text>
    <text y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      and helps you navigate life with clarity.
    </text>
  </g>

  <!-- 4 Archetypes Color Rail (Center Bottom) -->
  <g transform="translate(640, 455)" text-anchor="middle">
    <!-- Rail Container -->
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#06120D" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- ATLAS -->
    <circle cx="-160" cy="0" r="6" fill="#2563EB" />
    <text x="-146" y="4" text-anchor="start" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#93C5FD">ATLAS</text>

    <!-- MIRA -->
    <circle cx="-60" cy="0" r="6" fill="#059669" />
    <text x="-46" y="4" text-anchor="start" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#6EE7B7">MIRA</text>

    <!-- NOVA -->
    <circle cx="35" cy="0" r="6" fill="#D97706" />
    <text x="49" y="4" text-anchor="start" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FDE68A">NOVA</text>

    <!-- ARIA -->
    <circle cx="130" cy="0" r="6" fill="#7C3AED" />
    <text x="144" y="4" text-anchor="start" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#DDD6FE">ARIA</text>
  </g>

  <!-- Technology Badges Footer -->
  <g transform="translate(640, 560)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1">
      NEXT.JS 15 • NESTJS • FASTAPI • POSTGRESQL + PGVECTOR • REDIS 7.2 • DOCKER
    </text>
  </g>
</svg>
