<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0F241C" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#080E14" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#05080E" stop-opacity="1" />
    </radialGradient>

    <!-- Emerald-to-Lime Primary Gradient -->
    <linearGradient id="emeraldLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="accentBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <!-- Dark Facet Gradient -->
    <linearGradient id="darkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glass Rim Stroke -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filter for Luminous Presence Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="119" fill="none" stroke="url(#glassRim)" stroke-width="2" />

  <!-- Subtle Ambient Core Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#34D399" stroke-opacity="0.08" stroke-width="1" />

  <!-- Geometric NIVA 'N' Monogram -->
  <g transform="translate(136, 126)" filter="url(#coreGlow)">
    <!-- Left Vertical Pillar -->
    <path d="M 0 260 L 0 0 L 52 0 L 52 260 Z" fill="url(#emeraldLime)" />
    <!-- Left Pillar Inner Bevel -->
    <path d="M 52 0 L 52 260 L 68 260 L 68 0 Z" fill="url(#darkFacet)" opacity="0.6" />

    <!-- Diagonal Transition Blade -->
    <path d="M 0 0 L 188 260 L 240 260 L 52 0 Z" fill="url(#accentBeam)" />

    <!-- Right Vertical Pillar -->
    <path d="M 188 0 L 240 0 L 240 260 L 188 260 Z" fill="url(#emeraldLime)" />

    <!-- Corner Highlighting Facet -->
    <polygon points="0,0 52,0 0,72" fill="#A7F3D0" opacity="0.4" />
    <polygon points="188,260 240,260 240,188" fill="#ECFCCB" opacity="0.4" />
  </g>

  <!-- Luminous Awareness Core Node (Persistent Presence Indicator) -->
  <circle cx="376" cy="136" r="10" fill="#BEF264" />
  <circle cx="376" cy="136" r="18" fill="#10B981" fill-opacity="0.3" />
  <circle cx="376" cy="136" r="28" fill="#10B981" fill-opacity="0.12" />
</svg>
