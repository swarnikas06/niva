      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94A3B8">Architecture reviews, technical</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94A3B8">roadmaps &amp; objective analysis.</text>
