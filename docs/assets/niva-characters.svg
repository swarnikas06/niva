<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="charBgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0F1722" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#070A0F" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#040609" stop-opacity="1" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="atlasCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1E38" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#080F1E" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="miraCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2218" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#06120D" stop-opacity="0.95" />
