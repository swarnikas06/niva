    <pattern id="charGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" fill="url(#charBgGlow)" />
  <rect width="1200" height="440" fill="url(#charGrid)" />
  <rect width="1198" height="438" x="1" y="1" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Section Header -->
