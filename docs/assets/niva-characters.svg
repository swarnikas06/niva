      <text x="98" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#DDD6FE">Holistic Context</text>
    </g>

    <!-- Philosophy Quote -->
    <text x="22" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-style="italic" fill="#CBD5E1">
