    <linearGradient id="ariaCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D1236" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0E081F" stop-opacity="0.95" />
