    <linearGradient id="novaCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261A08" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#140D04" stop-opacity="0.95" />
